<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Smart TV Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      background: #0b0f19 url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2560&q=85') center/cover no-repeat;
    }

    .dashboard {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 24px;
      background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.4) 0%, rgba(11, 15, 25, 0.88) 100%);
    }

    .card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
    }

    /* Pasek górny */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clock-box { display: flex; align-items: baseline; gap: 12px; }
    .clock-box h1 { font-size: 2.6rem; font-weight: 800; line-height: 1; }
    .clock-box p { font-size: 0.95rem; color: #94a3b8; text-transform: capitalize; }

    .weather-widget {
      padding: 6px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .w-icon { font-size: 1.8rem; }
    .w-temp { font-size: 1.6rem; font-weight: 700; color: #38bdf8; text-align: right; line-height: 1; }
    .w-feels { font-size: 0.68rem; color: #94a3b8; }

    /* Środek */
    .middle-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1.15fr 1.15fr 0.7fr;
      gap: 8px;
    }
    .c-pad { padding: 8px 12px; }
    .card-title {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .run-verdict { font-size: 0.9rem; font-weight: 700; color: #4ade80; }
    .run-desc { font-size: 0.68rem; color: #cbd5e1; margin-top: 2px; }
    .metrics {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 4px;
      margin-top: 5px;
    }
    .m-lbl { font-size: 0.55rem; color: #94a3b8; text-transform: uppercase; }
    .m-val { font-size: 0.74rem; font-weight: 600; }

    /* Kafelki dojazdów */
    .commute-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px 10px;
      border-radius: 6px;
      margin-bottom: 5px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .commute-row:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.5);
    }
    .commute-name { font-size: 0.74rem; font-weight: 700; }
    .commute-sub { font-size: 0.58rem; color: #94a3b8; margin-top: 1px; }
    .commute-time { font-size: 0.88rem; font-weight: 800; color: #38bdf8; text-align: right; }

    .note-box {
      background: rgba(255, 255, 255, 0.04);
      border-left: 3px solid #fb923c;
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.68rem;
      color: #e2e8f0;
    }

    /* Kalendarz Tygodniowy */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-top: 4px;
    }
    .day-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 4px 6px;
      min-height: 42px;
    }
    .day-box.today {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.45);
    }
    .day-hdr {
      display: flex;
      justify-content: space-between;
      font-size: 0.65rem;
      font-weight: 700;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 2px;
    }
    .day-box.today .day-hdr { color: #38bdf8; }
    .day-txt { font-size: 0.58rem; color: #64748b; font-style: italic; margin-top: 2px; }

    /* Dolny pasek */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
    }
    .b-left { display: flex; align-items: center; gap: 14px; }
    .radio-unit { display: flex; align-items: center; gap: 8px; }
    .r-btn {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: #38bdf8; color: #0b0f19; font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .r-meta h4 { font-size: 0.74rem; font-weight: 700; }
    .r-meta p { font-size: 0.6rem; color: #94a3b8; }

    .cal-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .cal-btn:hover { background: rgba(56, 189, 248, 0.28); }
