<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Smart TV Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      background: #0b0f19 url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2560&q=85') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 36px;
    }

    .card {
      background: rgba(15, 23, 42, 0.70);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
    }

    /* Pasek górny */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clock-box { display: flex; align-items: baseline; gap: 16px; }
    .clock-box h1 { font-size: 3.4rem; font-weight: 800; line-height: 1; }
    .clock-box p { font-size: 1.1rem; color: #94a3b8; text-transform: capitalize; }

    .weather-widget {
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .w-icon { font-size: 2.2rem; }
    .w-temp { font-size: 2rem; font-weight: 700; color: #38bdf8; text-align: right; line-height: 1; }
    .w-feels { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

    /* Środek */
    .grid-3 {
      display: grid;
      grid-template-columns: 1.15fr 1fr 0.85fr;
      gap: 14px;
      margin-bottom: 12px;
    }
    .c-pad { padding: 14px 16px; }
    .card-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .run-verdict { font-size: 1.05rem; font-weight: 700; color: #4ade80; }
    .run-desc { font-size: 0.74rem; color: #cbd5e1; margin-top: 3px; line-height: 1.3; }
    .metrics {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 8px;
      margin-top: 10px;
    }
    .m-lbl { font-size: 0.62rem; color: #94a3b8; text-transform: uppercase; }
    .m-val { font-size: 0.82rem; font-weight: 600; }

    .commute-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .commute-name { font-size: 0.78rem; font-weight: 600; }
    .commute-sub { font-size: 0.65rem; color: #94a3b8; }
    .commute-time { font-size: 0.95rem; font-weight: 700; color: #38bdf8; }

    .note-box {
      background: rgba(255, 255, 255, 0.04);
      border-left: 2px solid #fb923c;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #e2e8f0;
    }

    /* Kalendarz Tygodniowy */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-top: 6px;
    }
    .day-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      padding: 6px 8px;
      min-height: 55px;
    }
    .day-box.today {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.4);
    }
    .day-hdr {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      font-weight: 700;
      color: #94a3b8;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 3px;
    }
    .day-box.today .day-hdr { color: #38bdf8; }
    .day-txt { font-size: 0.62rem; color: #64748b; font-style: italic; margin-top: 4px; }

    /* Dolny pasek */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
    }
    .b-left { display: flex; align-items: center; gap: 20px; }
    .radio-unit { display: flex; align-items: center; gap: 10px; }
    .r-btn {
      width: 34px; height: 34px; border-radius: 50%; border: none;
      background: #38bdf8; color: #0b0f19; font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
