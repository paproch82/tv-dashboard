<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
      background-color: #0b0f19;
    }

    /* Tło z tapetą */
    #bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-image: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2560&q=85');
      background-size: cover;
      background-position: center;
      transition: background-image 1s ease-in-out;
      z-index: 1;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.3) 0%, rgba(11, 15, 25, 0.88) 100%);
      z-index: 2;
    }

    /* Główny kontener */
    .dashboard {
      position: relative;
      z-index: 10;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 36px;
    }

    /* Styl kart */
    .card {
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
    }

    /* Pasek górny */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clock-box { display: flex; align-items: baseline; gap: 16px; }
    .clock-box h1 { font-size: 3.4rem; font-weight: 800; line-height: 1; letter-spacing: -1.5px; }
    .clock-box p { font-size: 1.05rem; color: #94a3b8; text-transform: capitalize; }

    .weather-widget {
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .w-icon { font-size: 2.2rem; }
    .w-temp { font-size: 2rem; font-weight: 700; color: #38bdf8; text-align: right; line-height: 1; }
    .w-feels { font-size: 0.75rem; color: #94a3b8; margin-top: 2px; }

    /* Środek */
    .grid-3 {
      display: grid;
      grid-template-columns: 1.15fr 1fr 0.85fr;
      gap: 14px;
      margin-bottom: 12px;
    }
    .c-pad { padding: 14px 16px; }
    .card-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .run-verdict { font-size: 1.05rem; font-weight: 700; color: #4ade80; }
    .run-desc { font-size: 0.74rem; color: #cbd5e1; margin-top: 3px; line-height: 1.3; }
    .metrics {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 8px;
      margin-top: 10px;
    }
    .m-lbl { font-size: 0.62rem; color: #94a3b8; text-transform: uppercase; }
    .m-val { font-size: 0.82rem; font-weight: 600; }

    .commute-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 7px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .commute-name { font-size: 0.78rem; font-weight: 600; }
    .commute-sub { font-size: 0.65rem; color: #94a3b8; }
    .commute-time { font-size: 0.9rem; font-weight: 700; color: #38bdf8; }
