<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.50);
      --bg-card: rgba(15, 23, 42, 0.40);
      --border-glass: rgba(255, 255, 255, 0.10);
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-yellow: #facc15;
      --accent-orange: #fb923c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      overflow: hidden;
      color: var(--text-main);
      background-color: #0b0f19;
      position: relative;
    }

    .bg-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2560&q=85') center/cover no-repeat;
      transition: opacity 1s ease-in-out;
      z-index: 1;
    }
    .bg-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.25) 0%, rgba(11, 15, 25, 0.85) 100%);
      z-index: 2;
    }

    .dashboard-container {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.8rem 2.8rem;
      gap: 0.8rem;
    }

    /* Pasek górny */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .clock-section { display: flex; align-items: baseline; gap: 1.2rem; }
    .clock-section h1 {
      font-size: 3.6rem;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }
